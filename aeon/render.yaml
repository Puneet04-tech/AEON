services:
  - type: web
    name: aeon-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: aeon
      - key: PAYPAL_ENV
        value: sandbox
  - type: worker
    name: aeon-worker
    env: python
    buildCommand: pip install -r worker/requirements.txt
    startCommand: cd worker && uvicorn app.main:app --host 0.0.0.0 --port $PORT
envVarGroups:
  - name: aeon-secrets
    envVars:
      - key: SESSION_SECRET
        sync: false
      - key: HMAC_SHARED_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: CF_API_TOKEN
        sync: false
